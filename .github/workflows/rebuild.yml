name: Rebuild calendars

on:
  schedule:
    # Mondays 12:00 UTC. The registrar posts new calendars a few times a year;
    # weekly is frequent enough to catch one within days.
    - cron: "0 12 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]

permissions:
  contents: write

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Rebuild calendars
        # build.py exits non-zero if the registrar's format changed, so a
        # broken parse fails the job instead of publishing an empty calendar.
        run: python build.py

      - name: Commit if the published calendars changed
        run: |
          # GitHub disables scheduled workflows on public repos after 60 days
          # with no repository activity. The registrar changes dates rarely, so
          # without a heartbeat this job would switch itself off. Commit a
          # timestamp if we are approaching that window.
          days_idle=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Days since last commit: $days_idle"

          if git diff --quiet -- docs/ && [ "$days_idle" -lt 50 ]; then
            echo "No calendar changes, and the cron is not at risk."
            exit 0
          fi

          date -u +%Y-%m-%d > docs/last-checked.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/

          if git diff --cached --quiet -- docs/ ':!docs/last-checked.txt'; then
            msg="chore: keepalive, no calendar changes ($(date -u +%Y-%m-%d))"
          else
            msg="chore: rebuild calendars ($(date -u +%Y-%m-%d))"
            echo "### Calendars updated" >> "$GITHUB_STEP_SUMMARY"
          fi
          git commit -m "$msg"
          git push
          git show --stat --oneline HEAD >> "$GITHUB_STEP_SUMMARY"
