name: Rebuild calendars

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      accept_count_change:
        description: "Accept a source count reduction after reviewing the PDF"
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: calendars-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Run offline regression and integration tests
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report
      - name: Audit runtime dependencies
        if: matrix.python == '3.14'
        run: python -m pip_audit -r requirements.txt --progress-spinner off

  rebuild:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Rebuild and validate all calendars
        env:
          ACCEPT_COUNT_CHANGE: ${{ inputs.accept_count_change || false }}
        run: |
          args=()
          if [ "$ACCEPT_COUNT_CHANGE" = "true" ]; then
            args+=(--accept-count-change)
          fi
          python build.py --verbose --report "$RUNNER_TEMP/build-report.json" \
            --log-file "$RUNNER_TEMP/build.log" "${args[@]}"

      - name: Add build results to the run summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          report_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "build-report.json"
          if report_path.exists():
              report = json.loads(report_path.read_text())
              lines = ["## Calendar build", "", "Status: " + report["status"], ""]
              for year, result in sorted(report["years"].items()):
                  if result["status"] == "valid":
                      lines.append("- {}: {} rows, {} events, {} undergraduate".format(
                          year, result["parsed"], result["kept"], result["audiences"].get("undergrad", 0)))
                  else:
                      lines.append("- {}: failed; see build diagnostics".format(year))
              publication = report.get("publication", {})
              lines += ["", "Changed files: {}".format(len(publication.get("changed", []))),
                        "Warnings and errors: {}".format(len(report["warnings"])), ""]
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("\n".join(lines))
          PY

      - name: Save diagnostics, including failed builds
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-diagnostics
          path: |
            ${{ runner.temp }}/build-report.json
            ${{ runner.temp }}/build.log
          retention-days: 30
          if-no-files-found: warn

      - name: Commit calendar changes or a schedule keepalive
        run: |
          # Stage before comparing so newly introduced feeds are counted too.
          git add -- docs/
          days_idle=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Days since last commit: $days_idle"
          if git diff --cached --quiet -- docs/ && [ "$days_idle" -lt 50 ]; then
            echo "No calendar changes or keepalive needed."
            exit 0
          fi

          if git diff --cached --quiet -- docs/; then
            message="chore: calendar schedule keepalive ($(date -u +%Y-%m-%d))"
          else
            message="chore: rebuild calendars ($(date -u +%Y-%m-%d))"
          fi
          date -u +%Y-%m-%d > docs/last-checked.txt
          git add -- docs/last-checked.txt
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "$message"
          # A concurrent source push fails here and prevents deployment.
          git push origin HEAD:main
          git show --stat --oneline HEAD >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the validated site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    needs: rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
